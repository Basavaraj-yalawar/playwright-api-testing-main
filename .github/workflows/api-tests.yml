name: Playwright API Tests

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Newman HTML Extra Reporter
        run: npm install -g newman-reporter-htmlextra

      - name: Run API tests
        run: npm run test:api
        continue-on-error: true
        env:
          BASE_URL: https://jsonplaceholder.typicode.com

      - name: Create reports directory
        run: mkdir -p reports/newman

      - name: Run Newman/Postman Collection
        continue-on-error: true
        run: |
          echo "Running Newman collection..."
          npx newman run postman/CRUD_VAL.postman_collection.json \
            --env-var base_url=https://jsonplaceholder.typicode.com/posts \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/newman/newman-report.html \
            --reporter-htmlextra-darkTheme
          echo "Newman execution completed"

      - name: List generated reports
        if: always()
        run: |
          echo "=== Reports Directory Structure ==="
          ls -la reports/ || echo "No reports directory"
          echo "=== Newman Reports ==="
          ls -la reports/newman/ || echo "No newman reports"
          echo "=== Playwright Reports ==="
          ls -la reports/playwright/ || echo "No playwright reports"

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright/
          retention-days: 30

      - name: Upload Newman HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/newman/
          retention-days: 30
